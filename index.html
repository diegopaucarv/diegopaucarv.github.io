                                month: "short",
                                year: "numeric",
                            })
                            .replace(/\./g, "")
                            .toUpperCase();

                    const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                    if (!iso) {
                        return raw.replace(/\s*[–-]\s*/g, " – ").toUpperCase();
                    }
                    const start = new Date(
                        Date.UTC(+iso[1], +iso[2] - 1, +iso[3]),
                    );

                    let end = null;
                    let endLabel = null;
                    if (exp.fin_anio) {
                        const finRaw = String(exp.fin_anio).trim();
                        if (/^(actual|actualidad|present)$/i.test(finRaw)) {
                            endLabel =
                                App.currentLanguage === "es"
                                    ? "Actual"
                                    : "Present";
                        } else {
                            const fin = finRaw.match(
                                /^(\d{4})-(\d{2})-(\d{2})$/,
                            );
                            if (fin)
                                end = new Date(
                                    Date.UTC(+fin[1], +fin[2] - 1, +fin[3]),
                                );
                        }
                    }
                    if (!end && !endLabel) {
                        const dur = parseFloat(exp.duracion_meses);
                        if (!isNaN(dur) && dur > 0) {
                            end = new Date(start);
                            end.setUTCMonth(
                                end.getUTCMonth() + Math.round(dur) - 1,
                            );
                        }
                    }
                    if (endLabel) return `${fmtMonth(start)} – ${endLabel}`;
                    return end
                        ? `${fmtMonth(start)} – ${fmtMonth(end)}`
                        : fmtMonth(start);
                },

                renderTeaching() {
                    const container = document.getElementById("teachingList");
                    const section = document.getElementById("teachingSection");
                    if (!container || !section) return;
                    const items = [...(App.cvData.teaching_experience || [])];
                    if (items.length === 0) {
                        section.style.display = "none";
                        return;
                    }
                    section.style.display = "block";
                    items.sort(
                        (a, b) =>
                            new Date(b.start_date || 0) -
                            new Date(a.start_date || 0),
                    );
                    container.innerHTML = items
                        .map((t) => {
                            const dates = this.formatDateRange(
                                t.start_date,
                                t.end_date,
                            );
                            return `
                        <div class="teaching-item">
                            <div class="teaching-header">
                                <h4>${this.escapeHtml(t.course_name || "")}</h4>
                                <span class="teaching-date">${dates}</span>
                            </div>
                            <p class="teaching-institution">${this.escapeHtml(t.institution || "")}${t.location ? ` · ${this.escapeHtml(t.location)}` : ""}</p>
                            ${t.description ? `<p class="teaching-description">${this.escapeHtml(t.description)}</p>` : ""}
                        </div>
                    `;
                        })
                        .join("");
                },

                renderProjects() {
                    const grid = document.getElementById("projectsGrid");
                    const section = document.getElementById("projectsSection");
                    if (!grid || !section) return;
                    const projects = App.cvData.portfolio_items || [];
                    if (projects.length === 0) {
                        section.style.display = "none";
                        return;
                    }
                    section.style.display = "block";
                    grid.innerHTML = projects
                        .map((project) => {
                            const link = project.repository_link || project.url;
                            const label = project.repository_link
                                ? "GitHub"
                                : App.currentLanguage === "es"
                                  ? "Ver proyecto"
                                  : "View project";
                            const hasImage = !!project.image_path;
                            return hasImage
                                ? `<div class="project-card has-image">
                                <div class="project-card-header">
                                    <img src="${this.escapeHtml(project.image_path)}" alt="${this.escapeHtml(project.title)}">
                                    <h3>${this.escapeHtml(project.title)}</h3>
                                    ${link ? `<a href="${this.escapeHtml(link)}" target="_blank" rel="noopener noreferrer" class="project-link">${label}</a>` : ""}
                                </div>
                                <p>${this.escapeHtml(project.description || "")}</p>
                            </div>`
                                : `<div class="project-card default-card">
                                <div class="project-card-header">
                                    <h3>${this.escapeHtml(project.title)}</h3>
                                    ${link ? `<a href="${this.escapeHtml(link)}" target="_blank" rel="noopener noreferrer" class="project-link">${label}</a>` : ""}
                                </div>
                                <p>${this.escapeHtml(project.description || "")}</p>
                            </div>`;
                        })
                        .join("");
                },

                renderPublications() {
                    const container =
                        document.getElementById("publicationsList");
                    const section = document.getElementById(
                        "publicationsSection",
                    );
                    if (!container || !section) return;
                    const pubs = [...(App.cvData.publications || [])];
                    if (pubs.length === 0) {
                        section.style.display = "none";
                        return;
                    }
                    section.style.display = "block";
                    pubs.sort(
                        (a, b) =>
                            this.getPublicationPriority(b) -
                                this.getPublicationPriority(a) ||
                            this.getSortableDate(b.year) -
                                this.getSortableDate(a.year),
                    );
                    container.innerHTML = pubs
                        .map(
                            (pub) => `
                        <div class="publication-item">
                            <h4>${this.escapeHtml(pub.title)}</h4>
                            <p class="pub-meta"><em>${this.escapeHtml(pub.journal_or_publisher || "")}</em>${pub.year ? `, ${pub.year}` : ""}</p>
                            ${pub.authors ? `<p>${this.escapeHtml(pub.authors)}</p>` : ""}
                            ${pub.contribution ? `<p class="pub-role">${this.escapeHtml(pub.contribution)}</p>` : ""}
                            ${pub.doi ? `<p class="pub-meta">DOI: ${this.escapeHtml(pub.doi)}</p>` : ""}
                            ${
                                pub.url
                                    ? `<a href="${this.escapeHtml(pub.url)}" target="_blank" rel="noopener noreferrer" class="publication-link">${
                                          App.currentLanguage === "es"
                                              ? "Ver publicación"
                                              : "View publication"
                                      }</a>`
                                    : ""
                            }
                        </div>
                    `,
                        )
                        .join("");
                },

                renderCredentials() {
                    const grid = document.getElementById("credentialsGrid");
                    const section =
                        document.getElementById("credentialsSection");
                    if (!grid || !section) return;
                    let src =
                        App.cvData.certifications?.length > 0
                            ? App.cvData.certifications
                            : (App.cvData.skills || [])
                                  .filter((s) => s.certificate_name?.trim())
                                  .map((s) => ({
                                      id: s.id,
                                      name: s.certificate_name,
                                      issuer:
                                          s.certificate_institution ||
                                          s.skill_name ||
                                          "",
                                      year: s.certificate_year,
                                      url: s.certificate_path || null,
                                      badge_path: null,
                                  }));
                    if (src.length === 0) {
                        section.style.display = "none";
                        return;
                    }
                    section.style.display = "block";
                    src = [...src].sort(
                        (a, b) =>
                            this.getSortableDate(b.year) -
                            this.getSortableDate(a.year),
                    );
                    grid.innerHTML = src
                        .map(
                            (cert) => `
                        <div class="credential-item">
                            ${
                                cert.badge_path
                                    ? `<div class="credential-badge-wrap"><img src="${this.escapeHtml(cert.badge_path)}" alt="${this.escapeHtml(cert.name)} badge" class="credential-badge" loading="lazy"></div>`
                                    : ""
                            }
                            <span class="credential-type">${App.currentLanguage === "es" ? "Certificación" : "Certification"}</span>
                            <h4>${this.escapeHtml(cert.name || "")}</h4>
                            <span class="credential-issuer">${this.escapeHtml(cert.issuer || "")}</span>
                            <span class="credential-year">${this.formatYear(cert.year)}</span>
                            ${
                                cert.url
                                    ? `<a href="${this.escapeHtml(cert.url)}" target="_blank" rel="noopener noreferrer" class="publication-link">${
                                          App.currentLanguage === "es"
                                              ? "Ver credencial"
                                              : "View credential"
                                      }</a>`
                                    : ""
                            }
                        </div>
                    `,
                        )
                        .join("");
                },

                renderInfoSections() {
                    const grid = document.getElementById("infoGrid");
                    if (!grid) return;
                    grid.innerHTML = "";
                    const education = [...(App.cvData.educacion || [])].sort(
                        (a, b) =>
                            new Date(b.fecha_inicio || 0) -
                            new Date(a.fecha_inicio || 0),
                    );
                    if (education.length > 0) {
                        const card = document.createElement("div");
                        card.className = "info-card";
                        card.innerHTML = `
                        <h3><span class="lang-content active" data-lang="en">Education</span><span class="lang-content" data-lang="es">Educación</span></h3>
                        ${education
                            .map(
                                (edu) => `
                            <div class="info-item">
                                <h4>${this.escapeHtml(edu.titulo || "")}</h4>
                                <p>${this.escapeHtml(edu.institucion || "")}</p>
                                <p>${this.formatYear(edu.fecha_inicio)}</p>
                            </div>
                        `,
                            )
                            .join("")}
                    `;
                        grid.appendChild(card);
                    }
                    const links = App.cvData.enlaces_personales || [];
                    if (links.length > 0) {
                        const card = document.createElement("div");
                        card.className = "info-card";
                        card.innerHTML = `
                        <h3><span class="lang-content active" data-lang="en">Links</span><span class="lang-content" data-lang="es">Enlaces</span></h3>
                        ${links
                            .map(
                                (link) => `
                            <div class="info-item">
                                <h4><a href="${this.escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${this.escapeHtml(link.tipo)}</a></h4>
                            </div>
                        `,
                            )
                            .join("")}
                    `;
                        grid.appendChild(card);
                    }
                    document.getElementById("infoSection").style.display =
                        education.length || links.length ? "block" : "none";
                },

                renderSkills() {
                    const section = document.getElementById("skillsSection");
                    if (!section) return;
                    const skills = (App.cvData.skills || []).filter(
                        (s) =>
                            !(s.certificate_name && s.certificate_name.trim()),
                    );
                    if (skills.length === 0) {
                        section.style.display = "none";
                        return;
                    }
                    section.style.display = "block";
                    section.innerHTML = `
                    <h2 class="section-title">
                        <span class="lang-content active" data-lang="en">Skills</span>
                        <span class="lang-content" data-lang="es">Habilidades</span>
                    </h2>
                    <div class="skills-grid">
                        ${skills.map((s) => `<span class="skill-tag">${this.escapeHtml(s.skill_name)}</span>`).join("")}
                    </div>
                `;
                },

                getCategoryClass(cat) {
                    const c = String(cat || "").toLowerCase();
                    if (c.includes("docencia") || c.includes("teaching"))
                        return "teaching";
                    if (
                        c.includes("investig") ||
                        c.includes("research") ||
                        c.includes("academic")
                    )
                        return "research";
                    if (
                        c.includes("practic") ||
                        c.includes("pasant") ||
                        c.includes("internship")
                    )
                        return "internship";
                    if (
                        c.includes("consult") ||
                        c.includes("analisis") ||
                        c.includes("analytics") ||
                        c.includes("locación") ||
                        c.includes("locacion") ||
                        c.includes("desarrollo") ||
                        c.includes("development")
                    )
                        return "consulting";
                    return "other";
                },

                getPublicationPriority(pub) {
                    const c = String(pub.contribution || "").toLowerCase();
                    if (
                        c.includes("lead author") ||
                        c.includes("autor principal")
                    )
                        return 100;
                    if (
                        c.includes("methodological") ||
                        c.includes("metodológico") ||
                        c.includes("data analyst") ||
                        c.includes("analista de datos")
                    )
                        return 80;
                    return 0;
                },

                escapeHtml(v) {
                    return String(v ?? "")
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#39;");
                },

                linkifyText(v) {
                    return this.escapeHtml(v).replace(
                        /(https?:\/\/[^\s<)]+)/g,
                        '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>',
                    );
                },

                formatYear(v) {
                    if (v === null || v === undefined || v === "") return "";
                    if (v === "Actual" || v === "Actualidad" || v === "Present")
                        return App.currentLanguage === "es"
                            ? "Actual"
                            : "Present";
                    if (typeof v === "number" && v >= 1900 && v <= 2100)
                        return String(v);
                    const raw = String(v).trim();
                    if (!raw) return "";
                    if (/^\d{4}$/.test(raw)) return raw;
                    const iso = raw.match(/^(\d{4})-\d{2}-\d{2}$/);
                    if (iso) return iso[1];
                    const d = new Date(raw);
                    return Number.isNaN(d.getTime())
                        ? raw
                        : String(d.getFullYear());
                },

                formatDateRange(start, end) {
                    const fmt = (d) => {
                        if (!d) return "";
                        const date = new Date(d);
                        if (Number.isNaN(date.getTime())) return String(d);
                        const locale =
                            App.currentLanguage === "es" ? "es-PE" : "en-US";
                        return date.toLocaleDateString(locale, {
                            month: "short",
                            year: "numeric",
                        });
                    };
                    const s = fmt(start),
                        e = fmt(end);
                    if (!s && !e) return "";
                    if (!e) return s;
                    return `${s} – ${e}`;
                },

                getSortableDate(v) {
                    if (v === "Actual" || v === "Actualidad" || v === "Present")
                        return Number.MAX_SAFE_INTEGER;
                    if (typeof v === "number") {
                        if (v >= 1900 && v <= 2100) return Date.UTC(v, 0, 1);
                        return v > 100000 ? v : 0;
                    }
                    const raw = String(v ?? "").trim();
                    if (!raw) return 0;

                    const iso = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                    if (iso) return Date.UTC(+iso[1], +iso[2] - 1, +iso[3]);
                    if (/^\d{4}$/.test(raw)) return Date.UTC(+raw, 0, 1);

                    const MONTHS = {
                        ene: 0,
                        enero: 0,
                        jan: 0,
                        january: 0,
                        feb: 1,
                        febrero: 1,
                        february: 1,
                        mar: 2,
                        marzo: 2,
                        march: 2,
                        abr: 3,
                        abril: 3,
                        apr: 3,
                        april: 3,
                        may: 4,
                        mayo: 4,
                        jun: 5,
                        junio: 5,
                        june: 5,
                        jul: 6,
                        julio: 6,
                        july: 6,
                        ago: 7,
                        agosto: 7,
                        aug: 7,
                        august: 7,
                        sep: 8,
                        sept: 8,
                        septiembre: 8,
                        september: 8,
                        oct: 9,
                        octubre: 9,
                        october: 9,
                        nov: 10,
                        noviembre: 10,
                        november: 10,
                        dic: 11,
                        diciembre: 11,
                        dec: 11,
                        december: 11,
                    };
                    const m = raw.match(/([a-záéíóú]+)\.?\s*(\d{4})/i);
                    if (m) {
                        const mon = m[1].toLowerCase();
                        if (MONTHS[mon] !== undefined)
                            return Date.UTC(+m[2], MONTHS[mon], 1);
                        return Date.UTC(+m[2], 0, 1);
                    }

                    const y = raw.match(/(\d{4})/);
                    if (y) return Date.UTC(+y[1], 0, 1);

                    const t = new Date(raw).getTime();
                    return Number.isNaN(t) ? 0 : t;
                },
            };

            /* ═══════════════════════════════════════════════════════════════
           CRUD
           ═══════════════════════════════════════════════════════════════ */
            const CRUD = {
                makeEditable(element, fieldType) {
                    if (!App.isLoggedIn) return;
                    if (element.querySelector(".edit-controls")) return;
                    const originalContent = element.innerHTML;
                    const input = document.createElement(
                        fieldType === "textarea" ? "textarea" : "input",
                    );
                    const tempDiv = document.createElement("div");
                    tempDiv.innerHTML = originalContent;
                    input.value = tempDiv.textContent.trim();
                    input.className = `editable-${fieldType}`;
                    element.innerHTML = "";
                    element.appendChild(input);
                    element.classList.add("edit-mode");
                    const saveBtn = document.createElement("button");
                    saveBtn.textContent = "Save";
                    saveBtn.type = "button";
                    saveBtn.className = "btn-primary";
                    saveBtn.style.marginRight = "0.5rem";
                    saveBtn.onclick = (e) => {
                        e.preventDefault();
                        CRUD.saveEdit(element, input.value);
                    };
                    const cancelBtn = document.createElement("button");
                    cancelBtn.textContent = "Cancel";
                    cancelBtn.type = "button";
                    cancelBtn.className = "btn-secondary";
                    cancelBtn.onclick = (e) => {
                        e.preventDefault();
                        CRUD.cancelEdit(element, originalContent);
                    };
                    const controls = document.createElement("div");
                    controls.className = "edit-controls active";
                    controls.appendChild(saveBtn);
                    controls.appendChild(cancelBtn);
                    element.appendChild(controls);
                    input.focus();
                    input.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" && fieldType === "text") {
                            e.preventDefault();
                            CRUD.saveEdit(element, input.value);
                        }
                        if (e.key === "Escape") {
                            e.preventDefault();
                            CRUD.cancelEdit(element, originalContent);
                        }
                    });
                },
                saveEdit(element, newValue) {
                    element.classList.remove("edit-mode");
                    element.innerHTML = newValue;
                    this.updateDataInMemory(element, newValue);
                    CacheManager.saveToCache(App.cvData);
                    if (App.isLoggedIn)
                        setTimeout(() => AutoExport.exportOnChange(), 100);
                },
                cancelEdit(element, html) {
                    element.classList.remove("edit-mode");
                    element.innerHTML = html;
                },
                deleteExperience(id) {
                    if (!confirm("Delete this experience?")) return;
                    // Try certified first
                    let idx = App.cvData.experiencia.findIndex(
                        (e) => String(e.id) === String(id),
                    );
                    if (idx !== -1) {
                        App.cvData.experiencia.splice(idx, 1);
                    } else {
                        // Try uncertified
                        const unc = App.cvData.experiencia_no_certificada || [];
                        idx = unc.findIndex((e) => String(e.id) === String(id));
                        if (idx !== -1) unc.splice(idx, 1);
                    }
                    CacheManager.saveToCache(App.cvData);
                    Render.renderTimeline();
                    if (App.isLoggedIn)
                        setTimeout(() => AutoExport.exportOnChange(), 100);
                },
                openCreateModal(tableName) {
                    const modal = document.getElementById("createModal");
                    const title = document.getElementById("createModalTitle");
                    const container = document.getElementById(
                        "formFieldsContainer",
                    );
                    const schema = this.getTableSchema(tableName);
                    title.textContent = `Add New ${tableName}`;
                    container.innerHTML = "";
                    Object.entries(schema).forEach(([field, type]) => {
                        const group = document.createElement("div");
                        group.className = "form-group";
                        const label = document.createElement("label");
                        label.textContent = field
                            .replace(/_/g, " ")
                            .toUpperCase();
                        const input = document.createElement(
                            type === "textarea" ? "textarea" : "input",
                        );
                        if (type !== "textarea")
                            input.type = type === "date" ? "date" : "text";
                        input.id = `field-${field}`;
                        input.dataset.field = field;
                        input.required = true;
                        group.appendChild(label);
                        group.appendChild(input);
                        container.appendChild(group);
                    });
                    modal.classList.add("active");
                    document.getElementById("createForm").dataset.table =
                        tableName;
                },
                closeCreateModal() {
                    document
                        .getElementById("createModal")
                        .classList.remove("active");
                    document.getElementById("createForm").reset();
                    document.getElementById("formFieldsContainer").innerHTML =
                        "";
                },
                handleCreateSubmit(event) {
                    event.preventDefault();
                    const form = document.getElementById("createForm");
                    const tableName = form.dataset.table;
                    const newEntry = {};
                    let valid = true;
                    form.querySelectorAll("[data-field]").forEach((input) => {
                        if (input.required && !input.value.trim()) {
                            valid = false;
                            input.style.borderColor = "red";
                        } else {
                            input.style.borderColor = "";
                            newEntry[input.dataset.field] = input.value;
                        }
                    });
                    if (!valid) {
                        alert("Fill all required fields.");
                        return;
                    }
                    const cur = App.cvData[tableName] || [];
                    const maxId = Math.max(
                        0,
                        ...cur.map((e) => Number(e.id) || 0),
                    );
                    newEntry.id = String(maxId + 1);
                    newEntry.persona_id = "1";
                    newEntry.lengua = App.currentLanguage;
                    if (tableName === "experiencia") {
                        newEntry.profesion_id = "1";
                        newEntry.lugar = "";
                        newEntry.logros = null;
                        newEntry.referencia = null;
                        newEntry.referencia_linkedin = null;
                    }
                    if (tableName === "educacion") {
                        newEntry.grado_instruccion = "";
                        newEntry.en_curso = false;
                    }
                    if (!App.cvData[tableName]) App.cvData[tableName] = [];
                    App.cvData[tableName].push(newEntry);
                    CacheManager.saveToCache(App.cvData);
                    if (tableName === "experiencia") Render.renderTimeline();
                    else if (
                        tableName === "educacion" ||
                        tableName === "enlaces_personales"
                    )
                        Render.renderInfoSections();
                    if (App.isLoggedIn)
                        setTimeout(() => AutoExport.exportOnChange(), 100);
                    this.closeCreateModal();
                    form.reset();
                },
                updateDataInMemory(element, newValue) {
                    const { table, field, id } = element.dataset;
                    if (
                        !table ||
                        !field ||
                        !id ||
                        !Array.isArray(App.cvData[table])
                    )
                        return;
                    const entry = App.cvData[table].find(
                        (i) => String(i.id) === String(id),
                    );
                    if (entry) entry[field] = newValue;
                },
                getTableSchema(tableName) {
                    const s = {
                        experiencia: {
                            institucion: "text",
                            rol: "text",
                            inicio_anio: "date",
                            tareas: "textarea",
                        },
                        educacion: {
                            titulo: "text",
                            institucion: "text",
                            fecha_inicio: "date",
                        },
                        enlaces_personales: { tipo: "text", url: "text" },
                    };
                    return s[tableName] || {};
                },
            };

            /* ═══════════════════════════════════════════════════════════════
           Bootstrap
           ═══════════════════════════════════════════════════════════════ */
            document.addEventListener("DOMContentLoaded", async () => {
                UI.initLanguageUI();
                UI.updateConfigButton();
                const toggle = document.getElementById("toggleUncertified");
                if (toggle) toggle.checked = App.showUncertified;
                await Auth.init();
                await Data.fetchCVData();
            });

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    document
                        .getElementById("loginModal")
                        ?.classList.contains("active") && UI.toggleLoginModal();
                    document
                        .getElementById("createModal")
                        ?.classList.contains("active") &&
                        CRUD.closeCreateModal();
                }
            });
        </script>
    </body>
