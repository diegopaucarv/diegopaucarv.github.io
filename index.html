<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Diego Paucar - CV</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap"
            rel="stylesheet"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --primary: #1a1a1a;
                --background: #f7f5f2;
                --surface: #ffffff;
                --text: #1a1a1a;
                --text-light: #4b4b4b;
                --text-muted: #8a8a8a;
                --border: #e2ddd8;
                --border-strong: #cfc9c2;
                --accent: #c0392b;

                /* Categorías por tipo de experiencia */
                --cat-consulting: #2563eb;
                --cat-research: #0891b2;
                --cat-teaching: #7c3aed;
                --cat-internship: #d97706;
                --cat-other: #6b6b6b;
            }

            body {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: var(--background);
                color: var(--text);
                line-height: 1.6;
            }

            /* ── HEADER CONTROLS ── */
            .header-controls {
                position: fixed;
                top: 1.5rem;
                right: 1.5rem;
                z-index: 1000;
                display: flex;
                gap: 0.75rem;
                align-items: center;
            }
            .language-toggle {
                display: flex;
                gap: 0;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 3px;
            }
            .lang-btn {
                padding: 0.35rem 0.7rem;
                background: transparent;
                border: none;
                cursor: pointer;
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-muted);
                transition: all 0.2s ease;
                border-radius: 4px;
                letter-spacing: 0.05em;
                font-family: "Inter", sans-serif;
            }
            .lang-btn.active {
                background: var(--primary);
                color: var(--surface);
            }
            .btn-config {
                padding: 0.4rem 0.85rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-light);
                transition: all 0.2s ease;
                letter-spacing: 0.03em;
                font-family: "Inter", sans-serif;
            }
            .btn-config:hover {
                background: var(--primary);
                color: var(--surface);
                border-color: var(--primary);
            }

            /* ── MODALS ── */
            .modal-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(26, 26, 26, 0.55);
                backdrop-filter: blur(2px);
                z-index: 2000;
                align-items: center;
                justify-content: center;
            }
            .modal-overlay.active {
                display: flex;
            }
            .modal {
                background: var(--surface);
                border-radius: 10px;
                padding: 2rem 2.25rem;
                width: 90%;
                max-width: 420px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
                border: 1px solid var(--border);
            }
            .modal h2 {
                margin-bottom: 1.5rem;
                font-size: 1.35rem;
                font-weight: 700;
                font-family: "Lora", Georgia, serif;
                letter-spacing: -0.02em;
            }
            .modal-form {
                display: flex;
                flex-direction: column;
                gap: 0.875rem;
            }
            .modal-form input {
                padding: 0.7rem 0.9rem;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-size: 0.95rem;
                background: var(--background);
                color: var(--text);
                font-family: "Inter", sans-serif;
            }
            .modal-form input:focus {
                outline: none;
                border-color: var(--primary);
                background: var(--surface);
                box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.06);
            }
            .modal-buttons {
                display: flex;
                gap: 0.75rem;
                margin-top: 0.5rem;
            }
            .btn-primary,
            .btn-secondary {
                flex: 1;
                padding: 0.7rem;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
                font-size: 0.9rem;
                transition: all 0.2s ease;
                font-family: "Inter", sans-serif;
            }
            .btn-primary {
                background: var(--primary);
                color: var(--surface);
            }
            .btn-primary:hover {
                background: #333;
            }
            .btn-secondary {
                background: transparent;
                color: var(--text-light);
                border: 1px solid var(--border);
            }
            .btn-secondary:hover {
                background: var(--background);
            }
            .modal-error {
                color: var(--accent);
                font-size: 0.875rem;
                margin-top: 0.25rem;
            }

            /* ── HEADER ── */
            .header {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 2.25rem;
                padding: 5rem 3rem 3rem;
                max-width: 960px;
                margin: 0 auto;
                border-bottom: 1px solid var(--border);
                align-items: start;
            }
            .profile-image {
                width: 110px;
                height: 110px;
                border-radius: 8px;
                object-fit: cover;
                border: 1px solid var(--border);
                background: var(--border);
            }
            .header-content h1 {
                font-size: 2.4rem;
                font-weight: 700;
                letter-spacing: -0.03em;
                line-height: 1.15;
                margin-bottom: 0.35rem;
                font-family: "Lora", Georgia, serif;
            }
            .header-professions {
                font-size: 0.98rem;
                color: var(--text-light);
                margin-bottom: 0.6rem;
                font-weight: 500;
            }
            .header-description {
                font-size: 0.92rem;
                color: var(--text-light);
                line-height: 1.6;
                margin-bottom: 1rem;
                max-width: 620px;
            }

            /* Contact bar */
            .contact-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 0.9rem 1.4rem;
                margin-bottom: 1rem;
                font-size: 0.85rem;
                color: var(--text-light);
            }
            .contact-bar a,
            .contact-bar span {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                color: var(--text-light);
                text-decoration: none;
            }
            .contact-bar a:hover {
                color: var(--text);
                text-decoration: underline;
            }
            .contact-bar svg {
                width: 13px;
                height: 13px;
                opacity: 0.7;
                flex-shrink: 0;
            }

            .btn-print {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.55rem 1.1rem;
                background: transparent;
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.85rem;
                font-weight: 600;
                transition: all 0.2s ease;
                font-family: "Inter", sans-serif;
            }
            .btn-print:hover {
                background: var(--primary);
                color: var(--surface);
                border-color: var(--primary);
            }

            /* ── SECTIONS ── */
            .section-wrapper {
                max-width: 960px;
                margin: 3.5rem auto;
                padding: 0 3rem;
            }
            .section-title {
                font-size: 0.72rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                color: var(--text-muted);
                margin-bottom: 1.75rem;
                display: flex;
                align-items: center;
                gap: 1rem;
            }
            .section-title::after {
                content: "";
                flex: 1;
                height: 1px;
                background: var(--border);
            }

            /* ── TIMELINE (single column) ── */
            .timeline {
                position: relative;
            }

            .timeline::before {
                content: "";
                position: absolute;
                left: 12px;
                top: 10px;
                bottom: 10px;
                width: 1px;
                background: var(--border);
            }

            .timeline-item {
                position: relative;
                padding-left: 3rem;
                margin-bottom: 2.25rem;
            }

            .timeline-bullet {
                position: absolute;
                left: 7px;
                top: 8px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--border);
                border: 2px solid var(--surface);
                box-shadow: 0 0 0 1px var(--border);
                z-index: 1;
            }
            .timeline-bullet.consulting {
                background: var(--cat-consulting);
                box-shadow: 0 0 0 1px var(--cat-consulting);
            }
            .timeline-bullet.research {
                background: var(--cat-research);
                box-shadow: 0 0 0 1px var(--cat-research);
            }
            .timeline-bullet.teaching {
                background: var(--cat-teaching);
                box-shadow: 0 0 0 1px var(--cat-teaching);
            }
            .timeline-bullet.internship {
                background: var(--cat-internship);
                box-shadow: 0 0 0 1px var(--cat-internship);
            }
            .timeline-bullet.other {
                background: var(--cat-other);
                box-shadow: 0 0 0 1px var(--cat-other);
            }

            .timeline-year {
                font-size: 0.7rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.1em;
                font-weight: 700;
                margin-bottom: 0.35rem;
                display: inline-block;
            }
            .timeline-item h3 {
                font-size: 1rem;
                font-weight: 700;
                color: var(--text);
                letter-spacing: -0.01em;
                line-height: 1.3;
                margin-bottom: 0.2rem;
            }
            .timeline-institution {
                font-size: 0.87rem;
                color: var(--text-light);
                font-weight: 500;
                margin-bottom: 0.5rem;
            }
            .timeline-category {
                display: inline-block;
                padding: 0.15rem 0.6rem;
                border-radius: 999px;
                background: var(--background);
                border: 1px solid var(--border);
                color: var(--text-muted);
                font-size: 0.7rem;
                font-weight: 600;
                letter-spacing: 0.02em;
                margin-bottom: 0.5rem;
            }
            .timeline-detail {
                font-size: 0.84rem;
                color: var(--text-light);
                line-height: 1.55;
                margin-top: 0.35rem;
            }
            .timeline-detail-label {
                font-weight: 700;
                color: var(--text);
                margin-right: 0.25rem;
            }
            .timeline-detail a {
                color: var(--cat-consulting);
                text-decoration: none;
                word-break: break-all;
            }
            .timeline-detail a:hover {
                text-decoration: underline;
            }

            /* ── TEACHING ── */
            .teaching-list {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .teaching-item {
                padding: 1rem 1.25rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-left: 3px solid var(--cat-teaching);
                border-radius: 8px;
            }
            .teaching-header {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 1rem;
                margin-bottom: 0.25rem;
            }
            .teaching-item h4 {
                font-size: 0.95rem;
                font-weight: 700;
                color: var(--text);
                letter-spacing: -0.01em;
            }
            .teaching-date {
                font-size: 0.75rem;
                color: var(--text-muted);
                font-weight: 600;
                white-space: nowrap;
            }
            .teaching-institution {
                font-size: 0.85rem;
                color: var(--text-light);
                margin-bottom: 0.4rem;
            }
            .teaching-description {
                font-size: 0.83rem;
                color: var(--text-light);
                line-height: 1.55;
            }

            /* ── PROJECTS / PUBLICATIONS / CREDENTIALS ── */
            .projects-grid,
            .credentials-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
                gap: 1.25rem;
            }
            .project-card,
            .credential-item {
                padding: 1.5rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
                transition:
                    box-shadow 0.2s ease,
                    border-color 0.2s ease;
            }
            .project-card:hover {
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
                border-color: var(--border-strong);
            }
            .project-card-header {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 1rem;
                margin-bottom: 0.6rem;
            }
            .project-card h3 {
                font-size: 1rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                color: var(--text);
                font-family: "Lora", Georgia, serif;
            }
            .project-card p {
                font-size: 0.84rem;
                color: var(--text-light);
                line-height: 1.55;
            }
            .project-link {
                display: inline-flex;
                align-items: center;
                gap: 0.3rem;
                font-size: 0.78rem;
                font-weight: 600;
                color: var(--text-muted);
                text-decoration: none;
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 0.25rem 0.6rem;
                white-space: nowrap;
                flex-shrink: 0;
            }
            .project-link:hover {
                background: var(--primary);
                color: var(--surface);
                border-color: var(--primary);
            }
            .project-link svg {
                width: 13px;
                height: 13px;
            }

            /* -- Image-enabled project card -- */
            .project-card.has-image {
                overflow: hidden;
            }

            .project-card.has-image img {
                width: 100%;
                height: 180px;
                object-fit: cover;
                display: block;
                transition: transform 0.3s ease;
            }

            .project-card.has-image:hover img {
                transform: scale(1.04);
            }

            .project-card.has-image .project-card-header {
                margin-bottom: 0.75rem;
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-start;
            }

            .project-card.has-image .project-link {
                position: absolute;
                top: 0.6rem;
                right: 0.6rem;
                bottom: auto;
                background: rgba(0, 0, 0, 0.7);
                border: none;
                z-index: 10;
            }

            /* -- Default (no-image) project card -- */
            .project-card.default-card {
                padding-left: 0.75rem;
            }

            .project-card.default-card::before {
                content: "";
                display: block;
                width: 4px;
                height: 100%;
                background: var(--primary);
                border-radius: 0 0 10px 0;
                position: absolute;
                left: 1.5rem;
                top: 0;
                bottom: 0;
            }

            .project-card.default-card > * {
                padding-left: 1.25rem;
            }

            /* -- Subtle base class change -- */
            .project-card {
                position: relative;
            }

            .publications-list {
                display: flex;
                flex-direction: column;
                gap: 1rem;
            }
            .publication-item {
                padding: 1.25rem 1.5rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
            }
            .publication-item h4 {
                font-size: 0.95rem;
                font-weight: 700;
                color: var(--text);
                letter-spacing: -0.01em;
                font-family: "Lora", Georgia, serif;
                margin-bottom: 0.35rem;
            }
            .pub-meta,
            .publication-item p {
                font-size: 0.82rem;
                color: var(--text-light);
                line-height: 1.5;
            }
            .pub-role {
                margin-top: 0.35rem;
                color: var(--text);
                font-weight: 600;
            }
            .publication-link {
                display: inline-block;
                margin-top: 0.45rem;
                color: var(--cat-consulting);
                font-size: 0.78rem;
                text-decoration: none;
                font-weight: 600;
            }
            .publication-link:hover {
                text-decoration: underline;
            }

            .credential-item {
                display: flex;
                flex-direction: column;
                gap: 0.2rem;
            }
            .credential-item h4 {
                font-size: 0.9rem;
                font-weight: 700;
                letter-spacing: -0.01em;
            }
            .credential-issuer {
                font-size: 0.82rem;
                color: var(--text-light);
                font-weight: 500;
            }
            .credential-year {
                font-size: 0.75rem;
                color: var(--text-muted);
                margin-top: 0.15rem;
            }
            .credential-type {
                font-size: 0.68rem;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-weight: 700;
            }

            /* ── INFO CARDS ── */
            .info-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                gap: 1.5rem;
            }
            .info-card {
                padding: 1.75rem;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--surface);
            }
            .info-card h3 {
                font-size: 0.72rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                color: var(--text-muted);
                margin-bottom: 1.25rem;
                padding-bottom: 0.75rem;
                border-bottom: 1px solid var(--border);
            }
            .info-item {
                margin-bottom: 1.1rem;
            }
            .info-item:last-child {
                margin-bottom: 0;
            }
            .info-item h4 {
                font-size: 0.9rem;
                font-weight: 600;
                margin-bottom: 0.15rem;
            }
            .info-item p {
                font-size: 0.82rem;
                color: var(--text-muted);
            }
            .info-item a {
                color: var(--text);
                text-decoration: none;
                font-weight: 500;
                font-size: 0.9rem;
                border-bottom: 1px solid var(--border);
            }
            .info-item a:hover {
                border-color: var(--text);
            }

            /* ── SKILLS ── */
            .skills-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .skill-tag {
                display: inline-block;
                padding: 0.35rem 0.85rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 100px;
                font-size: 0.82rem;
                color: var(--text-light);
                font-weight: 500;
                transition: all 0.2s ease;
            }
            .skill-tag:hover {
                background: var(--primary);
                color: var(--surface);
                border-color: var(--primary);
            }

            /* ── FOOTER ── */
            .footer {
                text-align: center;
                padding: 2rem 3rem;
                color: var(--text-muted);
                font-size: 0.82rem;
                border-top: 1px solid var(--border);
                margin-top: 4rem;
            }

            /* ── EDIT MODE ── */
            .editable-field {
                cursor: pointer;
                position: relative;
            }
            .editable-field:hover {
                background: rgba(26, 26, 26, 0.03);
                border-radius: 3px;
            }
            .editable-field.edit-mode {
                background: #fffbf0;
                padding: 0.4rem 0.6rem;
                border-radius: 4px;
                border: 1.5px solid var(--primary);
            }
            .editable-field input,
            .editable-field textarea {
                width: 100%;
                padding: 0.4rem 0.5rem;
                border: 1px solid var(--primary);
                border-radius: 4px;
                font-family: inherit;
                font-size: inherit;
                background: var(--surface);
                color: var(--text);
            }
            .edit-controls {
                display: none;
                gap: 0.5rem;
                margin-top: 0.5rem;
            }
            .edit-controls.active {
                display: flex;
            }
            .btn-delete {
                padding: 0.3rem 0.65rem;
                background: var(--accent);
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 0.78rem;
                font-weight: 600;
                opacity: 0;
                transition: opacity 0.15s ease;
                position: absolute;
                top: 0.25rem;
                right: 0.25rem;
                font-family: "Inter", sans-serif;
            }
            .timeline-item:hover .btn-delete,
            .info-item:hover .btn-delete {
                opacity: 1;
            }
            .btn-delete:hover {
                background: #a93226;
            }
            .btn-add {
                display: inline-block;
                padding: 0.45rem 0.9rem;
                background: transparent;
                color: var(--text-light);
                border: 1px dashed var(--border);
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.82rem;
                font-weight: 600;
                margin-top: 1rem;
                font-family: "Inter", sans-serif;
            }
            .btn-add:hover {
                background: var(--primary);
                color: var(--surface);
                border-color: var(--primary);
                border-style: solid;
            }

            /* ── CREATE MODAL ── */
            .create-modal {
                max-width: 560px;
            }
            .form-group {
                margin-bottom: 1rem;
            }
            .form-group label {
                display: block;
                font-weight: 600;
                margin-bottom: 0.4rem;
                font-size: 0.8rem;
                color: var(--text-light);
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }
            .form-group input,
            .form-group textarea {
                width: 100%;
                padding: 0.7rem 0.9rem;
                border: 1px solid var(--border);
                border-radius: 6px;
                font-family: "Inter", sans-serif;
                font-size: 0.95rem;
                background: var(--background);
                color: var(--text);
            }
            .form-group textarea {
                resize: vertical;
                min-height: 80px;
            }
            .form-group input:focus,
            .form-group textarea:focus {
                outline: none;
                border-color: var(--primary);
                background: var(--surface);
                box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.06);
            }

            /* ── LANGUAGE VISIBILITY ── */
            .lang-content {
                display: none;
            }
            .lang-content.active {
                display: block;
            }

            /* ── RESPONSIVE ── */
            @media (max-width: 768px) {
                .header {
                    grid-template-columns: 1fr;
                    gap: 1.5rem;
                    padding: 4rem 1.5rem 2.5rem;
                }
                .profile-image {
                    width: 80px;
                    height: 80px;
                }
                .header-content h1 {
                    font-size: 1.9rem;
                }
                .section-wrapper {
                    padding: 0 1.5rem;
                }
                .projects-grid,
                .credentials-grid,
                .info-grid {
                    grid-template-columns: 1fr;
                }
                .header-controls {
                    top: 0.75rem;
                    right: 0.75rem;
                    gap: 0.5rem;
                }
                .teaching-header {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 0.15rem;

            /* ── PRINT ── */
            @page {
                size: A4 portrait;
                margin: 14mm 12mm;
            }
            /* ── TOGGLE: non-certified experience ── */
            .toggle-uncertified {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.35rem 0.7rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
                user-select: none;
                font-size: 0.72rem;
                font-weight: 600;
                color: var(--text-light);
                letter-spacing: 0.03em;
                font-family: "Inter", sans-serif;
                transition: all 0.2s ease;
            }
            .toggle-uncertified:hover {
                border-color: var(--border-strong);
                color: var(--text);
            }
            .toggle-uncertified input {
                position: absolute;
                opacity: 0;
                width: 0;
                height: 0;
            }
            .toggle-track {
                width: 28px;
                height: 16px;
                background: var(--border-strong);
                border-radius: 999px;
                position: relative;
                flex-shrink: 0;
                transition: background 0.2s ease;
            }
            .toggle-track::after {
                content: "";
                position: absolute;
                top: 2px;
                left: 2px;
                width: 12px;
                height: 12px;
                background: white;
                border-radius: 50%;
                transition: transform 0.2s ease;
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
            }
            .toggle-uncertified input:checked + .toggle-track {
                background: var(--primary);
            }
            .toggle-uncertified input:checked + .toggle-track::after {
                transform: translateX(12px);
            }

            /* ── BADGES en credenciales ── */
            .credential-badge-wrap {
                height: 48px;
                margin-bottom: 0.75rem;
                display: flex;
                align-items: center;
            }
            .credential-badge {
                max-width: 48px;
                max-height: 48px;
                object-fit: contain;
                display: block;
                transition: transform 0.2s ease;
            }
            .credential-item:hover .credential-badge {
                transform: scale(1.05);
            }

            /* ── Hint visual para experiencia no certificada ── */
            .timeline-item.uncertified {
                opacity: 0.85;
            }
            .timeline-item.uncertified::before {
                content: "Sin certificado";

                top: 0.5rem;

                border: 1px solid var(--border);

                border-radius: 999px;
                letter-spacing: 0.03em;
                text-transform: uppercase;

            @media print {

        <script>
            /* ═══════════════════════════════════════════════════════════════
           CV APP — Estado global
           ═══════════════════════════════════════════════════════════════ */
            const App = {
                cvData: null,
                originalData: null,
                currentLanguage: localStorage.getItem("language") || "en",
                isLoggedIn: Boolean(localStorage.getItem("sessionToken")),
                credentials: null,
                dataVersion: "3.4", // bump: schema changed (badge_path, experiencia_no_certificada)
                showUncertified:
                    localStorage.getItem("showUncertified") !== "false",
            };

            const IS_FILE_PROTOCOL = location.protocol === "file:";

            /* ═══════════════════════════════════════════════════════════════
           CacheManager
           ═══════════════════════════════════════════════════════════════ */
            const CacheManager = {
                saveToCache(data) {
                    try {
                        localStorage.setItem(
                            "cvData_cache",
                            JSON.stringify({
                                data,
                                timestamp: new Date().toISOString(),
                                version: App.dataVersion,
                            }),
                        );
                    } catch (e) {
                        console.error("Cache save:", e);
                    }
                },
                loadFromCache() {
                    try {
                        const cached = localStorage.getItem("cvData_cache");
                        if (!cached) return null;
                        const parsed = JSON.parse(cached);
                        if (parsed.version === App.dataVersion)
                            return parsed.data;
                        localStorage.removeItem("cvData_cache");
                    } catch (e) {
                        console.error("Cache load:", e);
                    }
                    return null;
                },
            };

            /* ═══════════════════════════════════════════════════════════════
           Auth
           ═══════════════════════════════════════════════════════════════ */
            const Auth = {
                async init() {
                    if (IS_FILE_PROTOCOL) {
                        console.warn(
                            "file:// — login deshabilitado. Usa `python -m http.server` para desarrollo local.",
                        );
                        return;
                    }
                    try {
                        const r = await fetch("./config.json", {
                            cache: "no-store",
                        });
                        if (r.ok) App.credentials = await r.json();
                    } catch (e) {
                        console.warn(
                            "config.json no encontrado, login deshabilitado:",
                            e,
                        );
                    }
                },
                handleLogin(event) {
                    event.preventDefault();
                    const email = document.getElementById("emailInput").value;
                    const password =
                        document.getElementById("passwordInput").value;
                    const errorDiv = document.getElementById("modalError");
                    errorDiv.textContent = "";
                    if (!App.credentials) {
                        errorDiv.textContent = "Auth not configured.";
                        return;
                    }
                    const valid = App.credentials.users?.find(
                        (u) => u.email === email && u.password === password,
                    );
                    if (!valid) {
                        errorDiv.textContent = "Invalid email or password.";
                        return;
                    }
                    localStorage.setItem(
                        "sessionToken",
                        btoa(`${email}:${Date.now()}`),
                    );
                    App.isLoggedIn = true;
                    UI.updateConfigButton();
                    UI.toggleLoginModal();
                    document.getElementById("emailInput").value = "";
                    document.getElementById("passwordInput").value = "";
                    Render.renderCV();
                },
                logout() {
                    localStorage.removeItem("sessionToken");
                    App.isLoggedIn = false;
                    UI.updateConfigButton();
                    Render.renderCV();
                },
            };

            /* ═══════════════════════════════════════════════════════════════
           UI
           ═══════════════════════════════════════════════════════════════ */
            const UI = {
                changeLanguage(lang) {
                    App.currentLanguage = lang;
                    localStorage.setItem("language", lang);
                    this.initLanguageUI();
                    Data.refreshParsedData();
                },
                initLanguageUI() {
                    const lang = App.currentLanguage;
                    document.querySelectorAll(".lang-btn").forEach((btn) => {
                        btn.classList.toggle(
                            "active",
                            btn.dataset.lang === lang,
                        );
                    });
                    document.querySelectorAll(".lang-content").forEach((el) => {
                        el.classList.toggle("active", el.dataset.lang === lang);
                    });
                },
                toggleLoginModal() {
                    document
                        .getElementById("loginModal")
                        ?.classList.toggle("active");
                },
                updateConfigButton() {
                    const btn = document.getElementById("configBtn");
                    if (!btn) return;
                    if (App.isLoggedIn) {
                        btn.textContent = "🔓 Logout";
                        btn.onclick = () => {
                            Auth.logout();
                            UI.updateConfigButton();
                        };
                    } else {
                        btn.textContent = "⚙ Config";
                        btn.onclick = () => UI.toggleLoginModal();
                    }
                },
                toggleUncertified(checked) {
                    App.showUncertified = checked;
                    localStorage.setItem(
                        "showUncertified",
                        checked ? "true" : "false",
                    );
                    Render.renderTimeline();
                },
            };

            /* ═══════════════════════════════════════════════════════════════
           AutoExport
           ═══════════════════════════════════════════════════════════════ */
            const AutoExport = {
                isExporting: false,
                async exportOnChange() {
                    if (!App.isLoggedIn || this.isExporting) return;
                    this.isExporting = true;
                    try {
                        await this.exportToJSON();
                    } catch (e) {
                        console.error(e);
                    } finally {
                        this.isExporting = false;
                    }
                },
                async exportToJSON() {
                    if (!App.cvData) return;
                    const dataStr = JSON.stringify(
                        this.reconstructOriginalJSON(),
                        null,
                        2,
                    );
                    const blob = new Blob([dataStr], {
                        type: "application/json",
                    });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    link.download = `cv_modified_${new Date().toISOString().replace(/[:.]/g, "-").split("T")[0]}.json`;
                    link.style.display = "none";
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(() => {
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                    }, 100);
                },
                reconstructOriginalJSON() {
                    if (!App.originalData)
                        return { version: App.dataVersion, data: App.cvData };
                    const r = JSON.parse(JSON.stringify(App.originalData));
                    r.data = {
                        ...r.data,
                        datos_personales: this.mergeLanguageRows(
                            "datos_personales",
                            this.reconstructPersonalData(),
                        ),
                        profesiones: this.mergeLanguageRows(
                            "profesiones",
                            this.reconstructProfessions(),
                        ),
                        experiencia: this.mergeLanguageRows(
                            "experiencia",
                            this.reconstructExperience(),
                        ),
                        experiencia_no_certificada: this.mergeLanguageRows(
                            "experiencia_no_certificada",
                            this.reconstructExperienceNoCertificada(),
                        ),
                        teaching_experience: this.mergeLanguageRows(
                            "teaching_experience",
                            this.reconstructTeaching(),
                        ),
                        educacion: this.mergeLanguageRows(
                            "educacion",
                            this.reconstructEducation(),
                        ),
                        enlaces_personales: this.mergeLanguageRows(
                            "enlaces_personales",
                            this.reconstructLinks(),
                        ),
                        skills: this.mergeLanguageRows(
                            "skills",
                            this.reconstructSkills(),
                        ),
                        certifications: this.mergeLanguageRows(
                            "certifications",
                            this.reconstructCertifications(),
                        ),
                        publications: this.mergeLanguageRows(
                            "publications",
                            this.reconstructPublications(),
                        ),
                        portfolio_items: this.mergeLanguageRows(
                            "portfolio_items",
                            this.reconstructPortfolioItems(),
                        ),
                    };
                    return r;
                },
                mergeLanguageRows(tableName, rows) {
                    const orig = Array.isArray(
                        App.originalData?.data?.[tableName],
                    )
                        ? App.originalData.data[tableName]
                        : [];
                    const other = orig.filter(
                        (r) => this.getRowLanguage(r) !== App.currentLanguage,
                    );
                    return [...rows, ...other];
                },
                getRowLanguage(row) {
                    if (Array.isArray(row)) return row[row.length - 1];
                    if (row && typeof row === "object")
                        return row.lengua || null;
                    return null;
                },
                getOriginalPersonalRow() {
                    return (
                        App.originalData?.data?.datos_personales?.find(
                            (r) => r[r.length - 1] === App.currentLanguage,
                        ) ||
                        App.originalData?.data?.datos_personales?.[0] ||
                        []
                    );
                },
                reconstructPersonalData() {
                    const o = this.getOriginalPersonalRow();
                    return [
                        [
                            o[0] || "1",
                            App.cvData.nombres || o[1] || "",
                            App.cvData.telefono || o[2] || "",
                            App.cvData.email || o[3] || "",
                            App.cvData.lugar || o[4] || "",
                            App.cvData.perfil || o[5] || "",
                            App.currentLanguage,
                        ],
                    ];
                },
                reconstructProfessions() {
                    return (App.cvData.profesiones || []).map((i) => [
                        i.id || "1",
                        i.persona_id || "1",
                        i.profesion || "",
                        i.lengua || App.currentLanguage,
                    ]);
                },
                reconstructExperience() {
                    const expSchema = (App.originalData?.tables || []).find(
                        (t) => t.name === "experiencia",
                    );
                    const hasDur = expSchema?.columns?.some(
                        (c) => c.name === "duracion_meses",
                    );
                    const hasFin = expSchema?.columns?.some(
                        (c) => c.name === "fin_anio",
                    );
                    return (App.cvData.experiencia || []).map((i) => {
                        const base = [
                            i.id || "1",
                            i.persona_id || "1",
                            i.profesion_id || "1",
                            i.experiencia_categoria || "",
                            i.inicio_anio || "",
                        ];
                        if (hasDur) base.push(i.duracion_meses || "");
                        if (hasFin) base.push(i.fin_anio || "");
                        base.push(
                            i.institucion || "",
                            i.lugar || "",
                            i.rol || "",
                            i.tareas || "",
                            i.logros || null,
                            i.referencia || null,
                            i.referencia_linkedin || null,
                            i.lengua || App.currentLanguage,
                        );
                        return base;
                    });
                },
                reconstructExperienceNoCertificada() {
                    // misma estructura que experiencia (reusa schema detection)
                    const expSchema = (App.originalData?.tables || []).find(
                        (t) => t.name === "experiencia",
                    );
                    const hasDur = expSchema?.columns?.some(
                        (c) => c.name === "duracion_meses",
                    );
                    const hasFin = expSchema?.columns?.some(
                        (c) => c.name === "fin_anio",
                    );
                    return (App.cvData.experiencia_no_certificada || []).map(
                        (i) => {
                            const base = [
                                i.id || "u1",
                                i.persona_id || "1",
                                i.profesion_id || "1",
                                i.experiencia_categoria || "",
                                i.inicio_anio || "",
                            ];
                            if (hasDur) base.push(i.duracion_meses || "");
                            if (hasFin) base.push(i.fin_anio || "");
                            base.push(
                                i.institucion || "",
                                i.lugar || "",
                                i.rol || "",
                                i.tareas || "",
                                i.logros || null,
                                i.referencia || null,
                                i.referencia_linkedin || null,
                                i.lengua || App.currentLanguage,
                            );
                            return base;
                        },
                    );
                },
                reconstructTeaching() {
                    return (App.cvData.teaching_experience || []).map((i) => [
                        i.id || "1",
                        i.persona_id || "1",
                        i.course_name || "",
                        i.institution || "",
                        i.start_date || "",
                        i.end_date || null,
                        i.number_of_sessions || null,
                        i.location || "",
                        i.description || "",
                        i.lengua || App.currentLanguage,
                    ]);
                },
                reconstructEducation() {
                    return (App.cvData.educacion || []).map((i) => [
                        i.id || "1",
                        i.persona_id || "1",
                        i.grado_instruccion || "",
                        i.institucion || "",
                        i.titulo || "",
                        i.fecha_inicio || "",
                        Boolean(i.en_curso),
                        i.lengua || App.currentLanguage,
                    ]);
                },
                reconstructLinks() {
                    return (App.cvData.enlaces_personales || []).map((i) => [
                        i.id || "1",
                        i.persona_id || "1",
                        i.tipo || "",
                        i.url || "",
                        i.lengua || App.currentLanguage,
                    ]);
                },
                reconstructSkills() {
                    return (App.cvData.skills || []).map((i) => {
                        if (
                            i.certificate_name &&
                            String(i.certificate_name).trim() !== ""
                        ) {
                            return [
                                i.id || "1",
                                i.persona_id || "1",
                                i.profesion_id || null,
                                i.skill_name || "",
                                i.skill_level || "",
                                i.tipo_skill || "",
                                i.certificate_name || "",
                                i.certificate_year || "",
                                i.certificate_institution || "",
                                i.certificate_path || "",
                                i.lengua || App.currentLanguage,
                            ];
                        }
                        return [
                            i.id || "1",
                            i.persona_id || "1",
                            i.profesion_id || null,
                            i.skill_name || "",
                            i.skill_level || "",
                            i.tipo_skill || "",
                            i.certificate_name || "",
                            i.lengua || App.currentLanguage,
                        ];
                    });
                },
                reconstructCertifications() {
                    // 8 cols: id, pid, name, issuer, year, url, badge_path, lengua
                    return (App.cvData.certifications || []).map((i) => [
                        i.id || "1",
                        i.persona_id || "1",
                        i.name || "",
                        i.issuer || "",
                        i.year || "",
                        i.url || null,
                        i.badge_path || null,
                        i.lengua || App.currentLanguage,
                    ]);
                },
                reconstructPublications() {
                    return (App.cvData.publications || []).map((i) => [
                        i.id || "1",
                        i.persona_id || "1",
                        i.title || "",
                        i.authors || "",
                        i.year || "",
                        i.publication_type || "",
                        i.journal_or_publisher || "",
                        i.volume || null,
                        i.pages || null,
                        i.doi || null,
                        i.url || null,
                        i.contribution || "",
                        i.lengua || App.currentLanguage,
                    ]);
                },
                reconstructPortfolioItems() {
                    return (App.cvData.portfolio_items || []).map((i) => [
                        i.id || "1",
                        i.persona_id || "1",
                        i.item_type || "",
                        i.title || "",
                        i.description || "",
                        i.date_created || "",
                        i.url || null,
                        i.repository_link || null,
                        i.image_path || "",
                        i.additional_info || null,
                        i.lengua || App.currentLanguage,
                    ]);
                },
            };

            /* ═══════════════════════════════════════════════════════════════
           Data
           ═══════════════════════════════════════════════════════════════ */
            const Data = {
                async fetchCVData() {
                    if (IS_FILE_PROTOCOL) {
                        this.showFileProtocolBanner();
                        return;
                    }
                    try {
                        const r = await fetch("./cvs.json?t=" + Date.now(), {
                            cache: "no-store",
                        });
                        if (!r.ok) throw new Error(`HTTP ${r.status}`);
                        App.originalData = await r.json();
                        console.log(
                            `✅ cvs.json cargado: ${new Set(App.originalData.data.experiencia.map((x) => x[0])).size} entradas`,
                        );
                    } catch (e) {
                        console.error("❌ No se pudo cargar cvs.json:", e);
                        document.body.innerHTML = `
                        <div style="max-width:640px;margin:4rem auto;padding:2rem;font-family:system-ui,sans-serif">
                            <h1 style="color:#c0392b;margin-bottom:1rem">Error al cargar cvs.json</h1>
                            <p>${String(e.message || e)}</p>
                            <p style="margin-top:1rem;color:#666">Verifica que <code>cvs.json</code> exista junto a <code>index.html</code>.</p>
                        </div>`;
                        return;
                    }
                    const cached = App.isLoggedIn
                        ? CacheManager.loadFromCache()
                        : null;
                    if (cached) {
                        App.cvData = cached;
                        Render.renderCV();
                        return;
                    }
                    this.refreshParsedData();
                },
                showFileProtocolBanner() {
                    document.body.innerHTML = `
                    <div style="max-width:640px;margin:4rem auto;padding:2rem;font-family:system-ui,sans-serif;line-height:1.6">
                        <h1 style="color:#1a1a1a;margin-bottom:1rem">Necesitas un servidor local</h1>
                        <p>Estás abriendo este archivo con <code>file://</code>. Los navegadores no permiten cargar <code>cvs.json</code> desde disco por seguridad.</p>
                        <p style="margin-top:1.25rem"><strong>Ejecuta en la carpeta del proyecto:</strong></p>
                        <pre style="background:#f4f4f4;padding:1rem;border-radius:6px;margin-top:.75rem;overflow-x:auto">python -m http.server 8000</pre>
                        <p style="margin-top:1rem">Luego abre:</p>
                        <pre style="background:#f4f4f4;padding:1rem;border-radius:6px;margin-top:.75rem">http://localhost:8000</pre>
                    </div>`;
                },
                refreshParsedData() {
                    if (!App.originalData?.data) return;
                    const { data, tables } = App.originalData;
                    App.cvData = {
                        profesiones: this.mapAndFilter(
                            data.profesiones || [],
                            tables,
                            "profesiones",
                        ),
                        experiencia: this.mapAndFilter(
                            data.experiencia || [],
                            tables,
                            "experiencia",
                        ),
                        experiencia_no_certificada: this.mapAndFilter(
                            data.experiencia_no_certificada || [],
                            tables,
                            "experiencia_no_certificada",
                        ),
                        teaching_experience: this.mapAndFilter(
                            data.teaching_experience || [],
                            tables,
                            "teaching_experience",
                        ),
                        educacion: this.mapAndFilter(
                            data.educacion || [],
                            tables,
                            "educacion",
                        ),
                        enlaces_personales: this.mapAndFilter(
                            data.enlaces_personales || [],
                            tables,
                            "enlaces_personales",
                        ),
                        skills: this.mapAndFilter(
                            data.skills || [],
                            tables,
                            "skills",
                        ),
                        certifications: this.mapAndFilter(
                            data.certifications || [],
                            tables,
                            "certifications",
                        ),
                        portfolio_items: this.mapAndFilter(
                            data.portfolio_items || [],
                            tables,
                            "portfolio_items",
                        ),
                        publications: this.mapAndFilter(
                            data.publications || [],
                            tables,
                            "publications",
                        ),
                    };
                    const personalRow =
                        data.datos_personales.find(
                            (r) => r[r.length - 1] === App.currentLanguage,
                        ) || data.datos_personales[0];
                    App.cvData.nombres =
                        personalRow?.[1] || "Diego Mauricio Paucar Villacorta";
                    App.cvData.telefono = personalRow?.[2] || "";
                    App.cvData.email = personalRow?.[3] || "";
                    App.cvData.lugar = personalRow?.[4] || "";
                    App.cvData.perfil = personalRow?.[5] || "";
                    Render.renderCV();
                },
                mapAndFilter(arr, schema, tableName) {
                    if (!Array.isArray(arr)) return [];
                    return arr
                        .map((row, index) => {
                            let obj = {};

                            if (
                                tableName === "experiencia" ||
                                tableName === "experiencia_no_certificada"
                            ) {
                                if (Array.isArray(row)) {
                                    const len = row.length;
                                    const lengua = row[len - 1];
                                    if (len >= 15) {
                                        obj = {
                                            id: row[0],
                                            persona_id: row[1],
                                            profesion_id: row[2],
                                            experiencia_categoria: row[3],
                                            inicio_anio: row[4],
                                            duracion_meses: row[5],
                                            fin_anio: row[6],
                                            institucion: row[7],
                                            lugar: row[8],
                                            rol: row[9],
                                            tareas: row[10],
                                            logros: row[11],
                                            referencia: row[12],
                                            referencia_linkedin: row[13],
                                            lengua,
                                        };
                                    } else if (len === 14) {
                                        obj = {
                                            id: row[0],
                                            persona_id: row[1],
                                            profesion_id: row[2],
                                            experiencia_categoria: row[3],
                                            inicio_anio: row[4],
                                            duracion_meses: row[5],
                                            fin_anio: null,
                                            institucion: row[6],
                                            lugar: row[7],
                                            rol: row[8],
                                            tareas: row[9],
                                            logros: row[10],
                                            referencia: row[11],
                                            referencia_linkedin: row[12],
                                            lengua,
                                        };
                                    } else {
                                        obj = {
                                            id: row[0],
                                            persona_id: row[1],
                                            profesion_id: row[2],
                                            experiencia_categoria: row[3],
                                            inicio_anio: row[4],
                                            duracion_meses: null,
                                            fin_anio: null,
                                            institucion: row[5],
                                            lugar: row[6],
                                            rol: row[7],
                                            tareas: row[8],
                                            logros: row[9],
                                            referencia: row[10],
                                            referencia_linkedin: row[11],
                                            lengua,
                                        };
                                    }
                                } else {
                                    obj = { ...row };
                                }
                            } else if (tableName === "teaching_experience") {
                                obj = {
                                    id: row[0],
                                    persona_id: row[1],
                                    course_name: row[2],
                                    institution: row[3],
                                    start_date: row[4],
                                    end_date: row[5],
                                    number_of_sessions: row[6],
                                    location: row[7],
                                    description: row[8],
                                    lengua: row[row.length - 1],
                                };
                            } else if (tableName === "skills") {
                                const longF = row.length >= 11;
                                obj = {
                                    id: row[0],
                                    persona_id: row[1],
                                    profesion_id: row[2],
                                    skill_name: row[3],
                                    skill_level: row[4],
                                    tipo_skill: row[5],
                                    certificate_name: row[6] || "",
                                    certificate_year: longF ? row[7] : null,
                                    certificate_institution: longF
                                        ? row[8]
                                        : "",
                                    certificate_path: longF ? row[9] : "",
                                    lengua: row[row.length - 1],
                                };
                            } else if (tableName === "educacion") {
                                obj = {
                                    id: row[0],
                                    persona_id: row[1],
                                    grado_instruccion: row[2],
                                    institucion: row[3],
                                    titulo: row[4],
                                    fecha_inicio: row[5],
                                    en_curso: row[6],
                                    lengua: row[row.length - 1],
                                };
                            } else if (tableName === "portfolio_items") {
                                obj = {
                                    id: row[0],
                                    persona_id: row[1],
                                    item_type: row[2],
                                    title: row[3],
                                    description: row[4],
                                    date_created: row[5],
                                    url: row[6],
                                    repository_link: row[7],
                                    image_path: row[8],
                                    additional_info: row[9],
                                    lengua: row[row.length - 1],
                                };
                            } else if (tableName === "certifications") {
                                const hasBadge = row.length >= 8;
                                obj = {
                                    id: row[0],
                                    persona_id: row[1],
                                    name: row[2],
                                    issuer: row[3],
                                    year: row[4],
                                    url: row[5],
                                    badge_path: hasBadge ? row[6] : null,
                                    lengua: row[row.length - 1],
                                };
                            } else if (tableName === "publications") {
                                if (Array.isArray(row)) {
                                    if (row.length <= 2) {
                                        obj = {
                                            id: String(index + 1),
                                            persona_id: "1",
                                            title: row[0] || "",
                                            authors: "",
                                            year: "",
                                            publication_type: "",
                                            journal_or_publisher: "",
                                            volume: null,
                                            pages: null,
                                            doi: null,
                                            url: row[1] || null,
                                            contribution: "",
                                            lengua: null,
                                        };
                                    } else {
                                        obj = {
                                            id: row[0],
                                            persona_id: row[1],
                                            title: row[2],
                                            authors: row[3],
                                            year: row[4],
                                            publication_type: row[5],
                                            journal_or_publisher: row[6],
                                            volume: row[7],
                                            pages: row[8],
                                            doi: row[9],
                                            url: row[10],
                                            contribution: row[11] || "",
                                            lengua: row[row.length - 1],
                                        };
                                    }
                                } else {
                                    obj = { ...row };
                                }
                            } else {
                                const tbl = schema.find(
                                    (t) => t.name === tableName,
                                );
                                const cols =
                                    tbl?.columns?.map((c) => c.name) || [];
                                row.forEach((v, i) => {
                                    if (cols[i + 1]) obj[cols[i + 1]] = v;
                                });
                                obj.lengua = row[row.length - 1];
                            }
                            return obj;
                        })
                        .filter(
                            (i) =>
                                !i.lengua || i.lengua === App.currentLanguage,
                        );
                },
            };

            /* ═══════════════════════════════════════════════════════════════
           Render
           ═══════════════════════════════════════════════════════════════ */
            const Render = {
                renderCV() {
                    if (!App.cvData) return;
                    document.getElementById("personName").textContent =
                        App.cvData.nombres || "Diego Paucar";
                    document.getElementById("professions").textContent =
                        App.cvData.profesiones
                            ?.map((p) => p.profesion)
                            .join(" | ") || "";
                    document.getElementById("description").textContent =
                        App.cvData.perfil || "";
                    this.renderContact();
                    this.renderTimeline();
                    this.renderTeaching();
                    this.renderProjects();
                    this.renderPublications();
                    this.renderCredentials();
                    this.renderInfoSections();
                    this.renderSkills();

                    const addBtn = document.getElementById("addExpBtn");
                    if (addBtn)
                        addBtn.style.display = App.isLoggedIn
                            ? "inline-block"
                            : "none";
                    UI.initLanguageUI();
                },

                renderContact() {
                    const bar = document.getElementById("contactBar");
                    if (!bar) return;
                    const items = [];
                    const e = App.cvData.email,
                        t = App.cvData.telefono,
                        l = App.cvData.lugar;
                    const links = App.cvData.enlaces_personales || [];
                    if (e)
                        items.push(
                            `<a href="mailto:${this.escapeHtml(e)}">✉ ${this.escapeHtml(e)}</a>`,
                        );
                    if (t) items.push(`<span>☎ ${this.escapeHtml(t)}</span>`);
                    if (l) items.push(`<span>📍 ${this.escapeHtml(l)}</span>`);
                    ["LinkedIn", "GitHub"].forEach((name) => {
                        const link = links.find((x) => x.tipo === name);
                        if (link)
                            items.push(
                                `<a href="${this.escapeHtml(link.url)}" target="_blank" rel="noopener">${name} ↗</a>`,
                            );
                    });
                    bar.innerHTML = items.join("");
                    bar.style.display = items.length ? "flex" : "none";
                },

                renderTimeline() {
                    const container =
                        document.getElementById("timelineContainer");
                    if (!container) return;

                    // Merge certified + uncertified (if toggle is on)
                    const exps = (App.cvData.experiencia || []).map((e) => ({
                        ...e,
                        _uncertified: false,
                    }));
                    if (App.showUncertified) {
                        (App.cvData.experiencia_no_certificada || []).forEach(
                            (e) => {
                                exps.push({ ...e, _uncertified: true });
                            },
                        );
                    }

                    if (exps.length === 0) {
                        container.innerHTML = `<p style="color:var(--text-muted);font-size:0.9rem">${
                            App.currentLanguage === "es"
                                ? "No hay experiencia disponible."
                                : "No experience available."
                        }</p>`;
                        return;
                    }

                    exps.sort((a, b) => {
                        const endA = this.getEndDate(a);
                        const endB = this.getEndDate(b);
                        if (endA !== endB) return endB - endA;
                        return (
                            this.getSortableDate(b.inicio_anio) -
                            this.getSortableDate(a.inicio_anio)
                        );
                    });

                    container.innerHTML = exps
                        .map((exp) => {
                            const dateRange = this.getDisplayDateRange(exp);
                            const catClass = this.getCategoryClass(
                                exp.experiencia_categoria,
                            );
                            const institution = this.escapeHtml(
                                exp.institucion || "",
                            );
                            const location = this.escapeHtml(exp.lugar || "");
                            const rol = this.escapeHtml(exp.rol || "");
                            const tableName = exp._uncertified
                                ? "experiencia_no_certificada"
                                : "experiencia";
                            const uncertifiedClass = exp._uncertified
                                ? " uncertified"
                                : "";

                            const durNum = parseFloat(exp.duracion_meses);
                            const durLabel =
                                !isNaN(durNum) && durNum > 0
                                    ? `${durNum} ${
                                          App.currentLanguage === "es"
                                              ? durNum === 1
                                                  ? "mes"
                                                  : "meses"
                                              : durNum === 1
                                                ? "month"
                                                : "months"
                                      }`
                                    : "";
                            const subtitle = [location, durLabel]
                                .filter(Boolean)
                                .join(" - ");

                            const deleteBtn = App.isLoggedIn
                                ? `<button class="btn-delete" onclick="CRUD.deleteExperience('${exp.id}')">Delete</button>`
                                : "";
                            const desc = exp.tareas
                                ? `<p class="timeline-detail">${this.linkifyText(exp.tareas)}</p>`
                                : "";
                            const logr = exp.logros
                                ? `<p class="timeline-detail">${this.linkifyText(exp.logros)}</p>`
                                : "";

                            return `
                        <div class="timeline-item${uncertifiedClass}" data-exp-id="${exp.id}" data-exp-table="${tableName}">
                            <div class="timeline-bullet ${catClass}"></div>
                            <p class="timeline-year">${dateRange}</p>
                            <h3 class="editable-field"
                                data-table="${tableName}" data-id="${exp.id}" data-field="institucion"
                                ondblclick="CRUD.makeEditable(this, 'text')">${institution}</h3>
                            ${subtitle ? `<p class="timeline-institution">${subtitle}</p>` : ""}
                            ${
                                rol
                                    ? `<span class="timeline-category editable-field"
                                         data-table="${tableName}" data-id="${exp.id}" data-field="rol"
                                         ondblclick="CRUD.makeEditable(this, 'text')">${rol}</span>`
                                    : ""
                            }
                            ${desc}
                            ${logr}
                            ${deleteBtn}
                        </div>
                    `;
                        })
                        .join("");
                },
                getEndDate(exp) {
                    const finRaw = String(exp.fin_anio || "").trim();
                    if (finRaw) {
                        if (/^(actual|actualidad|present)$/i.test(finRaw))
                            return Number.MAX_SAFE_INTEGER;
                        const parsed = this.getSortableDate(finRaw);
                        if (parsed > 0) return parsed;
                    }
                    const inicioRaw = String(exp.inicio_anio || "");
                    if (/(actual|actualidad|present)/i.test(inicioRaw))
                        return Number.MAX_SAFE_INTEGER;
                    const inicioTs = this.getSortableDate(exp.inicio_anio);
                    const dur = parseFloat(exp.duracion_meses);
                    if (inicioTs > 0 && !isNaN(dur) && dur > 0) {
                        return inicioTs + dur * 30 * 24 * 60 * 60 * 1000;
                    }
                    return inicioTs;
                },

                getDisplayDateRange(exp) {
                    const raw = String(exp.inicio_anio || "").trim();
                    if (!raw) return "";

                    const locale =
                        App.currentLanguage === "es" ? "es-PE" : "en-US";
                    const fmtMonth = (d) =>
                        d
                            .toLocaleDateString(locale, {
